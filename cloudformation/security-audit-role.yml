AWSTemplateFormatVersion: '2010-09-09'
Description: >
  'Creates a role that authorizes cross-account access from one aws account to a security audit role in another account.
  Grants access to the ViewOnlyAccess and SecurityAudit managed job functions in the target account. Deploy only in a single region.
  Last updated at 2026-08-23 by phillips.james@gmail.com'
Metadata:
  Version: 3.0
Parameters:
  Contact:
    Type: String
    Description: "contact resources for questions about this stack"
    Default: "James Phillips phillips.james@gmail.com"
  Owner:
    Type: String
    Description: "email address of owner of this stack"
  OrgPrefix:
    Type: String
    Description: "Organizational prefix for resources"
    Default: "opspath"
    AllowedPattern: "[a-z]*"
  PrincipalAccountId:
    Type: String
    Description: 12 digit id of the account containing the users to which you're granting access
    AllowedPattern: "\\d{12}"
  TrustedPrincipalArnPattern:
    Type: String
    Description: >
      IAM principal ARN pattern (matched with a StringLike condition) within PrincipalAccountId that is
      allowed to assume this role. Scope this to the specific SSO permission set or role you use for
      audit work, rather than trusting every IAM principal in the account, e.g.
      arn:aws:iam::<PrincipalAccountId>:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_YourPermissionSetName_*
      Pass "*" only if you intentionally want to trust every IAM principal in PrincipalAccountId.
  RequireMFA:
    Type: String
    Description: >
      Require aws:MultiFactorAuthPresent on the calling session to assume this role. Must be "false"
      if your workforce users access AWS through AWS IAM Identity Center: Identity Center sessions never
      carry aws:MultiFactorAuthPresent (enforce MFA at Identity Center sign-in instead), so "true" locks
      every SSO user out of the role. Only set to "true" for IAM users or federated principals whose
      sessions are issued with MFA context (e.g. sts:GetSessionToken with an MFA device).
    AllowedValues: ["true", "false"]
    Default: "false"
  MaxSessionDurationSeconds:
    Type: Number
    Description: "Maximum session duration, in seconds, for role sessions. Must be between 3600 (1 hour) and 43200 (12 hours)."
    Default: 7200
    MinValue: 3600
    MaxValue: 43200
Conditions:
  ShouldRequireMFA: !Equals [!Ref RequireMFA, "true"]
Resources:
  AssumeRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonInspector2ReadOnlyAccess
        - arn:aws:iam::aws:policy/AWSSecurityHubReadOnlyAccess
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
      RoleName: !Join [ "-", [ !Ref OrgPrefix, "CrossAccountSecurityAuditRole"] ]
      MaxSessionDuration: !Ref MaxSessionDurationSeconds
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            AWS: "*" # this is done to allow the use of SSO in the PrincipalAccountId.
            # By using the wildcard and the Condition keys, you are trusting only the specific principal(s)
            # matching TrustedPrincipalArnPattern within PrincipalAccountId - narrower than trusting the
            # whole account root, since SSO permission set role ARNs contain a generated path segment that
            # can't be referenced directly as a Principal.
          Action:
          - sts:AssumeRole
          Condition: !If
            - ShouldRequireMFA
            - StringEquals:
                aws:PrincipalAccount: !Ref PrincipalAccountId
              StringLike:
                aws:PrincipalArn: !Ref TrustedPrincipalArnPattern
              Bool:
                aws:MultiFactorAuthPresent: "true"
            - StringEquals:
                aws:PrincipalAccount: !Ref PrincipalAccountId
              StringLike:
                aws:PrincipalArn: !Ref TrustedPrincipalArnPattern
      Policies:
           - PolicyName: SupplementalReadOnlyAccess
             PolicyDocument:
              Version: "2012-10-17"
              Statement:
              - Effect: Allow
                Action:
                - notifications-contacts:GetEmailContact
                - notifications-contacts:ListEmailContacts
                - notifications-contacts:ListTagsForResource
                - notifications:GetEventRule
                - notifications:GetNotificationConfiguration
                - notifications:GetNotificationEvent
                - notifications:ListChannels
                - notifications:ListEventRules
                - notifications:ListNotificationConfigurations
                - notifications:ListNotificationEvents
                - notifications:ListNotificationHubs
                - notifications:ListTagsForResource
                Resource: "*"
                Sid: NotificationsReadOnly
              - Effect: Allow
                Action:
                - access-analyzer:CheckAccessNotGranted
                - access-analyzer:CheckNoNewAccess
                - access-analyzer:GetAccessPreview
                - access-analyzer:GetAnalyzedResource
                - access-analyzer:GetAnalyzer
                - access-analyzer:GetArchiveRule
                - access-analyzer:GetFinding
                - access-analyzer:GetFindingsStatistics
                - access-analyzer:GetGeneratedPolicy
                - access-analyzer:ListAccessPreviewFindings
                - access-analyzer:ListAccessPreviews
                - access-analyzer:ListAnalyzedResources
                - access-analyzer:ListAnalyzers
                - access-analyzer:ListArchiveRules
                - access-analyzer:ListFindings
                - access-analyzer:ListPolicyGenerations
                - access-analyzer:ListTagsForResource
                - access-analyzer:ValidatePolicy
                Resource: "*"
                Sid: AllowAccessAnalyzerView
              - Effect: Allow
                Action:
                - servicediscovery:ListNamespaces
                Resource: "*"
                Sid: ServiceDiscovery
              - Effect: Allow
                Action:
                - account:ListRegions
                - apigateway:GET
                - dlm:GetLifecyclePolicies
                - dlm:GetLifecyclePolicy
                - dlm:ListTagsForResource
                - dynamodb:GetResourcePolicy
                - ecr:Describe*
                - guardduty:Describe*
                - guardduty:Get*
                - guardduty:List*
                - macie2:Describe*
                - macie2:Get*
                - macie2:List*
                - s3:GetStorageLensConfiguration
                - s3:GetStorageLensDashboard
                - shield:Describe*
                - shield:Get*
                - shield:List*
                - wafv2:Describe*
                - wafv2:Get*
                - wafv2:List*
                Resource: "*"
                Sid: DescribeSecurityServices
              - Effect: Allow
                Action:
                - cloudtrail:ListEventDataStores
                Resource: "*"
                Sid: CloudTrail
              - Effect: Allow
                Action:
                - codeartifact:Describe*
                - codeartifact:GetDomainPermissionsPolicy
                - codeartifact:GetRepositoryPermissionsPolicy
                - codeartifact:List*
                - codebuild:BatchGetBuilds
                - codebuild:BatchGetProjects
                - codebuild:BatchGetReportGroups
                - codebuild:BatchGetReports
                - codebuild:Describe*
                - codebuild:List*
                - codecommit:BatchGet*
                - codecommit:Describe*
                - codecommit:GetApprovalRuleTemplate
                - codecommit:GetBranch
                - codecommit:GetComment
                - codecommit:GetCommentsForComparedCommit
                - codecommit:GetCommentsForPullRequest
                - codecommit:GetCommit
                - codecommit:GetCommitHistory
                - codecommit:GetDifferences
                - codecommit:GetMergeCommit
                - codecommit:GetMergeConflicts
                - codecommit:GetMergeOptions
                - codecommit:GetPullRequest*
                - codecommit:List*
                - codeconnections:List*
                - codedeploy:BatchGet*
                - codedeploy:List*
                - codepipeline:Get*
                - codepipeline:List*
                - codestar:List*
                - codestar-connections:List*
                - codestar-notifications:List*
                Resource: "*"
                Sid: CodeStar
              - Effect: Allow
                Action:
                - account:GetAccountInformation
                - account:GetAlternateContact
                - account:GetContactInformation
                - billing:Get*
                - billing:List*
                - ce:Describe*
                - ce:Get*
                - ce:List*
                - consolidatedbilling:Get*
                - consolidatedbilling:List*
                - cur:Describe*
                - cur:Get*
                - freetier:Get*
                - invoicing:Get*
                - invoicing:List*
                - payments:Get*
                - payments:List*
                - tax:Get*
                - tax:List*
                Resource: "*"
                Sid: BillingAndAccountAudit
              - Effect: Allow
                Action:
                - bedrock:Get*
                - bedrock:List*
                - bedrock-agentcore:Get*
                - bedrock-agentcore:List*
                - codewhisperer:Get*
                - codewhisperer:List*
                - qbusiness:Get*
                - qbusiness:List*
                - qdeveloper:List*
                Resource: "*"
                Sid: AIServiceAudit
      Tags:
        - Key: Owner
          Value: !Ref Owner
        - Key: Contact
          Value: !Ref Contact
Outputs:
  SecurityAuditRoleArn:
    Description: "CrossAccountSecurityAuditRole role Arn"
    Value: !GetAtt AssumeRole.Arn
